{% extends "base.html" %}

{% block title %}404 - Không tìm thấy{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-4 fw-bold text-danger">404</h1>
    <h4 class="mb-3">Không tìm thấy trang hoặc dữ liệu yêu cầu</h4>
    <p class="text-muted">{{ error.description if error and error.description else "Đường dẫn bạn truy cập không tồn tại." }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-2">Quay về Dashboard</a>
</div>
{% endblock %}
